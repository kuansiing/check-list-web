<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Check List App</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Helvetica, sans-serif;
      }
      .body {
        background-color: #f4f4f4;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .container {
        width: 400px;
        background: whitesmoke;
        padding: 25px;
        border: radius 15px;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
      }

      h2 {
        text-align: center;
        margin-bottom: 20px;
      }

      #taskInput {
        flex: 1;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 8px;
      }

      #AddBtn {
        padding: 10px 15px;
        background-color: #28a745;
        color: aliceblue;
        border: none;
        border-radius: 7px;
      }

      #categorySelect{
        padding:15px;
        border-radius: 5px;
        border: 1px;
      }

      ul {
        list-style: none;
        margin-top: 20px;
      }
      li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px;
        background-color: #f8f8f8;
        margin-bottom: 15px;
        border-radius: 5px;
      }

      .task-text {
        flex: 1;
        cursor: pointer;
      }

      .completed {
        text-decoration: line-through;
        color: gray;
      }


    .edit-btn {
      background-color: #007bff;
      color:white;
      border:none;
      padding:10px;
      margin-right: 7px;
      border-radius:5px;
      cursor:pointer;
    }

    .edit-btn:hover{
      background-color:#0056b3;
    }


      .delete-btn {
        background-color: rgb(198, 77, 77);
        color: white;
        border: none;
        padding: 6px 10px;
        border-radius: 4px;
      }

      .delete-btn:hover {
        background-color: #c82333;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Check List</h1>

      <div class="Task">
        <input type-="text" id="taskInput" placeholder="Enter your task" />
        <button id="AddBtn">Add</button>
      </div>

      <select id="categorySelect">
        <option value="Study">Study</option>
                <option value="Work">Work</option>
        <option value="Personal">Personal</option>

        <button id="AddBtn">Add</button>
        
      </select>

      

      </div>

      <ul id="taskList"></ul>
    </div>

    <script>
      const taskInput = document.getElementById("taskInput");
      const AddBtn = document.getElementById("AddBtn");
      const taskList = document.getElementById("taskList");
      const categorySelect = document.getElementById("categorySelect");
      
// persist the tasks in local storage
      let tasks = JSON.parse(localStorage.getItem("tasks")) || [];


      //Completed the tasks after done
      function saveTasks() {
        localStorage.setItem("tasks", JSON.stringify(tasks));
      }

      function renderTasks() {
        taskList.innerHTML = "";

        tasks.forEach((task, index) => {
          const li = document.createElement("li");
          const span = document.createElement("span");
          span.textContent = task.text;
          span.classList.add("task-text");

          if (task.completed) {
            span.classList.add("completed");
          }

          span.addEventListener("click", () => {
            tasks[index].completed = !tasks[index].completed;
            saveTasks();
            renderTasks();
          });

          //Select categories button
          const category = document.createElement("small");
          category.textContent ="Category: "+task.category;


          const taskContainer =document.createElement("div");
          taskContainer.appendChild(span);
                    taskContainer.appendChild(document.createElement("br"));
                    taskContainer.appendChild(category);

                    
                    const buttonContainer =document.createElement("div");

                    //Edit button

                    
                    const editBtn =document.createElement("button");
                    
                    editBtn.textContent = "Edit";
                    editBtn.classList.add("edit-btn");

                    editBtn.addEventListener("click",()=>{
                      const newTask = taskInput.value.trim();

                      if(newTask !== ""){
                        tasks[index].text =newTask;

                         saveTasks();
                        renderTasks();
                        taskInput.value ="";
                      }else{
                        alert("Type new task in the box first.")
                      }
                      
 
                       
                      
                    })



//Delete Button
          const deleteBtn = document.createElement("button");
          deleteBtn.textContent = "Delete";
          deleteBtn.classList.add("delete-btn");

          deleteBtn.addEventListener("click", () => {
            tasks.splice(index, 1);
            saveTasks();
            renderTasks();
          });

          buttonContainer.appendChild(editBtn);
          buttonContainer.appendChild(deleteBtn);

          li.appendChild(taskContainer);
          li.appendChild(buttonContainer);

          taskList.appendChild(li);
        });
      }


      // Add tasks
      function addTasks() {
        const taskText = taskInput.value.trim();

        if (taskText === "") {
          alert("Please enter a task");
          return;
        }

        tasks.push({
          text: taskText,
          category: categorySelect.value,
          completed:false
        });

        saveTasks();
        renderTasks();

        taskInput.value = "";
      }

      AddBtn.addEventListener("click", addTasks);

      taskInput.addEventListener("keypress", function (event) {
        if (event.key === "Enter") {
          addTasks();
        }
      });
    </script>
  </body>
</html>
